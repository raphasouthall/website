<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="350" viewBox="0 0 1400 350" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- gradients run down-left along each band: bright at top-right edge, black by the bottom -->
    <linearGradient id="g1" x1="0.9" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#0a84e6"/>
      <stop offset="0.3" stop-color="#0a45b0"/>
      <stop offset="0.7" stop-color="#03102e"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="g2" x1="0.85" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#0d5fd8"/>
      <stop offset="0.35" stop-color="#0a2f96"/>
      <stop offset="0.75" stop-color="#02071e"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="g3" x1="0.9" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#0a3aa8"/>
      <stop offset="0.5" stop-color="#051750"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="g4" x1="1" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#1450d8"/>
      <stop offset="0.45" stop-color="#0a2a90"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="g5" x1="1" y1="0.4" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0d3ea8"/>
      <stop offset="0.6" stop-color="#040c2c"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="lg" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="1400" height="350" fill="#000"/>
  <g filter="url(#lg)">

  <polygon points="230,-30 520,-30 300,380 10,380" fill="url(#g1)"/>
  <polygon points="520,-30 1085,-30 800,380 300,380" fill="url(#g2)" opacity="0.85"/>
  <polygon points="1085,-30 1240,-30 930,380 800,380" fill="url(#g3)"/>
  <polygon points="1240,-30 1400,-30 1400,200 1080,380 930,380" fill="url(#g4)" opacity="0.9"/>
  <polygon points="1400,200 1400,380 1080,380" fill="url(#g5)"/>

  </g>
  <rect width="1400" height="350" fill="url(#fade)"/>
</svg>
