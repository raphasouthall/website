<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="350" viewBox="0 0 1400 350" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0.9" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#0a84e6"/>
      <stop offset="0.3" stop-color="#0a45b0"/>
      <stop offset="0.7" stop-color="#03102e"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="g2" x1="0.85" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#0d5fd8"/>
      <stop offset="0.35" stop-color="#0a2f96"/>
      <stop offset="0.75" stop-color="#02071e"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="g3" x1="0.9" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#0a3aa8"/>
      <stop offset="0.5" stop-color="#051750"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="g4" x1="1" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#1450d8"/>
      <stop offset="0.45" stop-color="#0a2a90"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="g5" x1="1" y1="0.4" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0d3ea8"/>
      <stop offset="0.6" stop-color="#040c2c"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </linearGradient>
    <!-- frosted: soft blur on the glow layer only, shapes stay crisp -->
    <filter id="frost" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <!-- 1px white highlight along the top-right edge of each band -->
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.36"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="350" fill="#000"/>

  <!-- blurred glow layer behind the bands (frosted spill) -->
  <g filter="url(#frost)" opacity="0.7">
    <polygon points="230,0 520,0 300,350 10,350" fill="url(#g1)"/>
    <polygon points="520,0 1085,0 800,350 300,350" fill="url(#g2)"/>
    <polygon points="1085,0 1240,0 930,350 800,350" fill="url(#g3)"/>
    <polygon points="1240,0 1400,0 1400,200 1080,350 930,350" fill="url(#g4)"/>
    <polygon points="1400,200 1400,350 1080,350" fill="url(#g5)"/>
  </g>

  <!-- crisp translucent glass bands -->
  <g opacity="0.72">
    <polygon points="230,0 520,0 300,350 10,350" fill="url(#g1)"/>
    <polygon points="520,0 1085,0 800,350 300,350" fill="url(#g2)"/>
    <polygon points="1085,0 1240,0 930,350 800,350" fill="url(#g3)"/>
    <polygon points="1240,0 1400,0 1400,200 1080,350 930,350" fill="url(#g4)"/>
    <polygon points="1400,200 1400,350 1080,350" fill="url(#g5)"/>
  </g>

  <!-- edge highlights, same as the card inset shadow -->
  <g stroke="url(#edge)" stroke-width="1.5" fill="none">
    <line x1="520" y1="0" x2="300" y2="350"/>
    <line x1="1085" y1="0" x2="800" y2="350"/>
    <line x1="1240" y1="0" x2="930" y2="350"/>
    <line x1="1400" y1="200" x2="1080" y2="350"/>
  </g>

  <rect width="1400" height="350" fill="url(#fade)"/>
</svg>
