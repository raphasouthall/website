		%sveltekit.head%

		<!-- Schema.org -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "ProfessionalService",
			"name": "SolidPlus Ltd",
			"description": "Freelance Azure platform engineering by Raphael Southall through SolidPlus Ltd. Landing zones, AKS, Terraform, security hardening and pipeline automation.",
			"url": "https://solidplus.tech",
			"foundingDate": "2025",
			"founder": {
				"@type": "Person",
				"name": "Raphael Southall",
				"sameAs": [
					"https://github.com/raphasouthall",
					"https://www.linkedin.com/in/raphael-southall-021214197"
				]
			},
			"address": {
				"@type": "PostalAddress",
				"addressCountry": "GB",
				"addressRegion": "Scotland"
			},
			"areaServed": {
				"@type": "Country",
				"name": "United Kingdom"
			},
			"knowsAbout": [

				"Azure Kubernetes Service",
				"Terraform",
				"Azure DevOps",
				"Cloud Security",
				"FinOps"
			],
			"hasOfferCatalog": {
				"@type": "OfferCatalog",
				"name": "Azure Platform Engineering Services",
				"itemListElement": [
					{
						"@type": "Offer",
						"itemOffered": {
							"@type": "Service",
							"name": "Azure Landing Zones and Terraform",
							"description": "Subscriptions, networking, private endpoints, Key Vault, RBAC and policy built as code and deployed through pipelines."
						}
					},
					{
						"@type": "Offer",
						"itemOffered": {
							"@type": "Service",
							"name": "AKS and Kubernetes Operations",
							"description": "Private AKS clusters in production: version upgrades, Helm deployments, ingress, certificates and rollout monitoring."
						}
					},
					{
						"@type": "Offer",
						"itemOffered": {
							"@type": "Service",
							"name": "Security Hardening",
							"description": "Automated certificate rotation, Defender and Rapid7 findings turned into tracked work, least-privilege automation identities."
						}
					},
					{
						"@type": "Offer",
						"itemOffered": {
							"@type": "Service",
							"name": "Pipelines and Automation",
							"description": "Azure DevOps and GitHub Actions pipelines replacing manual runbooks, with managed identities and failure alerting."
						}
					},
					{
						"@type": "Offer",
						"itemOffered": {
							"@type": "Service",
							"name": "Cloud Cost Control",
							"description": "Azure cost review, Advisor and reservation recommendations, right-sizing and monthly reporting for finance."
						}
					},
					{
						"@type": "Offer",
						"itemOffered": {
							"@type": "Service",
							"name": "AI Tooling for Infrastructure Teams",
							"description": "MCP servers, Azure AI Foundry pilots and self-hosted models wired into operations work with production guardrails."
						}
					}
				]
			}
		}

		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "FAQPage",
			"mainEntity": [
				{
					"@type": "Question",
					"name": "What kind of work do you take on?",
					"acceptedAnswer": {
						"@type": "Answer",
						"text": "Azure platform work: landing zones, networking, AKS, Terraform, pipelines, certificate and secret automation, cost reviews and security hardening. I do not do application development or generic IT support."
					}
				},
				{
					"@type": "Question",
					"name": "How long does an engagement take?",
					"acceptedAnswer": {
						"@type": "Answer",
						"text": "A cost or security review takes 1 to 2 weeks. A landing zone or AKS build takes 4 to 8 weeks. Ongoing operations run on a monthly retainer with an agreed number of days."
					}
				},
				{
					"@type": "Question",
					"name": "How do you charge?",
					"acceptedAnswer": {
						"@type": "Answer",
						"text": "Fixed price for defined deliverables, day rate for open-ended operations work. Both are written into the scope before I start. Invoices come from SolidPlus Ltd, a UK company, so procurement gets a normal supplier."
					}
				}
			]
		}
		</script>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
